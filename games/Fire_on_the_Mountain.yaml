name: Fire on the Mountain

brief-description: |
  Fire on the Mountain is a linear furry visual novel set at Campsite 7 in Crestfall National Park. Follow the staff and visitors around a strange, neglected corner of the park while exploring an interactive map, playing minigames, and uncovering the mystery surrounding the off-limits Blackthroat Peak. Choices are optional and do not alter the main story.

description: |
  Welcome to Campsite 7, one of the strangest corners of Crestfall National Park. The rangers largely ignore it, the lakes come with dubious warnings, and Blackthroat Peak is forbidden for a reason.

  Fire on the Mountain is a linear furry visual novel featuring minigames, an interactive map, and optional side conversations. Choices do not change the main narrative.

  The game is safe for work, but is intended for mature audiences and includes themes involving sex, alcohol, drug use, violence, child endangerment, depression, and suicidal ideation.

