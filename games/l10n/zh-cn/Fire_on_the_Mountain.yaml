name: 山中之火 / Fire on the Mountain

brief-description: |
  《山中之火》是一部线性 Furry 视觉小说，故事发生在 Crestfall National Park 的 7 号营地。你将跟随这里的工作人员与访客，探索这个被护林员长期忽视的古怪角落；游戏包含小游戏、可交互地图和非关键选项，并逐步揭开禁止进入的 Blackthroat Peak 背后的谜团。游戏中的选择不会改变主线剧情。

description: |
  欢迎来到 Crestfall National Park 的 7 号营地——公园里最古怪的角落之一。护林员几乎不管这里，湖泊总伴随着可疑的警告，而 Blackthroat Peak 被禁止进入也有它的理由。

  《山中之火》是一部线性 Furry 视觉小说，包含小游戏、可交互地图和可选的支线对话。游戏中的选择不会改变主线剧情。

  本作内容本身为 SFW，但面向成熟玩家，并涉及性、酒精、药物使用、暴力、儿童处于危险之中、抑郁以及自杀意念等成人主题。

